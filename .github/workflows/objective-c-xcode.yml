name: Xcode - Build and Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and analyse CCTChess
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and analyze the iOS app
        run: >-
          xcodebuild build analyze
          -project CCTChess/CCTChess.xcodeproj
          -scheme CCTChess
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/cct-build"
          CODE_SIGNING_ALLOWED=NO
