name: Swift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: CCTChess unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads((Path(os.environ["RUNNER_TEMP"]) / "simulators.json").read_text())
          iphones = [d for runtime, group in devices["devices"].items()
                     if ".iOS-" in runtime for d in group
                     if d.get("isAvailable") and d["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No available iPhone simulator")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("CCT_SIMULATOR_ID=" + iphones[0]["udid"] + "\n")
          PY
      - name: Run iOS unit tests
        run: >-
          xcodebuild test
          -project CCTChess/CCTChess.xcodeproj
          -scheme CCTChess
          -destination "platform=iOS Simulator,id=$CCT_SIMULATOR_ID"
          -derivedDataPath "$RUNNER_TEMP/cct-tests"
          CODE_SIGNING_ALLOWED=NO
